<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIVERSE HANDS</title>
    <meta
      name="description"
      content="Hand-controlled visuals on your live webcam: black hole, living tattoos, fire from your palms. Free, open source, everything runs locally."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="UNIVERSE HANDS" />
    <meta
      property="og:description"
      content="Hand-controlled visuals on your live webcam: black hole, living tattoos, fire from your palms. Free, open source, everything runs locally."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://universe-hands.vercel.app/" />
    <meta property="og:image" content="https://universe-hands.vercel.app/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNIVERSE HANDS" />
    <meta name="twitter:image" content="https://universe-hands.vercel.app/og.jpg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 18px;
        bottom: 16px;
        font-family: "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: 0.14em;
        color: rgba(190, 225, 235, 0.85);
        white-space: pre;
        text-shadow: 0 0 8px rgba(80, 200, 220, 0.35), 0 1px 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        user-select: none;
        z-index: 5;
      }
      #hud::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: linear-gradient(rgba(120, 220, 240, 0.7), rgba(120, 220, 240, 0.05));
      }
      .hint {
        animation: pulse 1.6s ease-in-out infinite;
        color: rgba(255, 190, 120, 0.9);
      }
      .dim {
        color: rgba(190, 225, 235, 0.38);
      }
      .active {
        color: rgba(255, 190, 120, 0.95);
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      #hub {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 38%, #0a1018 0%, #000 78%);
        z-index: 10;
        font-family: "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
      }
      #hub.hidden {
        display: none;
      }
      #hub::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.022) 0 1px,
          transparent 1px 3px
        );
        pointer-events: none;
      }
      .hub-inner h1 {
        margin: 0 0 6px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.4em;
        color: #dbf7ff;
        text-shadow: 0 0 22px rgba(0, 220, 255, 0.55);
      }
      .hub-sub {
        margin: 0 0 30px;
        font-size: 11px;
        letter-spacing: 0.24em;
        color: rgba(190, 225, 235, 0.42);
      }
      .hub-item {
        display: grid;
        grid-template-columns: 44px 230px 1fr;
        align-items: baseline;
        gap: 14px;
        width: min(620px, 86vw);
        margin: 0 0 10px;
        padding: 15px 20px;
        background: rgba(8, 16, 22, 0.55);
        border: 1px solid rgba(110, 240, 255, 0.16);
        border-left: 3px solid rgba(110, 240, 255, 0.5);
        color: inherit;
        font: 13px/1.4 inherit;
        letter-spacing: 0.12em;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      .hub-item:hover {
        background: rgba(110, 240, 255, 0.09);
        border-left-color: #ffc86e;
        transform: translateX(5px);
      }
      .hub-num {
        color: rgba(255, 200, 110, 0.85);
      }
      .hub-title {
        color: #e8fcff;
      }
      .hub-desc {
        color: rgba(190, 225, 235, 0.45);
        font-size: 11px;
      }
      .hub-foot {
        margin-top: 24px;
        font-size: 10px;
        letter-spacing: 0.22em;
        color: rgba(190, 225, 235, 0.3);
      }
      .hub-credits {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(110, 240, 255, 0.12);
        font-size: 9px;
        letter-spacing: 0.18em;
        color: rgba(190, 225, 235, 0.32);
      }
      .hub-credits a {
        color: rgba(110, 240, 255, 0.65);
        text-decoration: none;
      }
      .hub-credits a:hover {
        color: #ffc86e;
      }
      #controls {
        position: fixed;
        top: 14px;
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 6;
      }
      #controls button {
        background: rgba(8, 16, 22, 0.6);
        border: 1px solid rgba(110, 240, 255, 0.3);
        color: rgba(190, 225, 235, 0.85);
        font-family: "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        padding: 10px 14px;
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #ffc86e;
      }
      #controls button.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud">INITIALIZING...</div>
    <div id="hub"></div>
    <div id="controls">
      <button id="flip">FLIP CAM</button>
      <button id="exit" class="hidden">X HUB</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
